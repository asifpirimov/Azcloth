{% extends 'base.html' %}

{% block title %}Səbət | AzCloth{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-extrabold text-gray-900">Səbətiniz</h1>
        <a href="{% url 'marketplace:home' %}" class="text-indigo-600 hover:underline">Alış-verişə davam et</a>
    </div>

    <div id="cartContainer" class="space-y-8">
        <!-- Cart grouped by store will be rendered here by JS -->
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const cartContainer = document.getElementById('cartContainer');
        let cart = JSON.parse(localStorage.getItem('azcloth_cart') || '[]');
        
        if (cart.length === 0) {
            cartContainer.innerHTML = `
                <div class="bg-white p-12 text-center rounded-2xl shadow-sm border border-gray-100">
                    <p class="text-gray-500 mb-4">Səbətiniz boşdur.</p>
                    <a href="{% url 'marketplace:home' %}" class="bg-indigo-600 text-white px-6 py-3 rounded-full font-medium hover:bg-indigo-700">Məhsulları Kəşf Et</a>
                </div>
            `;
            return;
        }

        // Group by store
        const grouped = {};
        cart.forEach((item, index) => {
            if (!grouped[item.storeName]) {
                grouped[item.storeName] = { phone: item.storePhone, items: [] };
            }
            item.index = index;
            grouped[item.storeName].items.push(item);
        });

        let html = '';
        for (const [storeName, data] of Object.entries(grouped)) {
            let storeHtml = `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-6">
                    <div class="px-6 py-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                        <h2 class="font-bold text-lg text-gray-900">${storeName}</h2>
                    </div>
                    <div class="divide-y divide-gray-100">
            `;

            let storeTotal = 0;
            let orderMessage = `Salam. AzCloth-da ${storeName} mağazasından aşağıdakı məhsullarla maraqlanıram:\n\n`;

            data.items.forEach(item => {
                storeTotal += item.price * item.qty;
                orderMessage += `- ${item.productName} (${item.variant}) x ${item.qty} ədəd = ${item.price * item.qty} AZN\n  Link: ${item.productUrl}\n\n`;
                
                storeHtml += `
                    <div class="p-6 flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            ${item.image ? `<img src="${item.image}" class="w-16 h-16 object-cover rounded-md">` : '<div class="w-16 h-16 bg-gray-100 rounded-md"></div>'}
                            <div>
                                <a href="${item.productUrl}" class="font-medium text-gray-900 hover:text-indigo-600">${item.productName}</a>
                                <p class="text-sm text-gray-500">Variant: ${item.variant} | Qiymət: ${item.price} AZN</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-6">
                            <span class="text-gray-900 font-medium">Say: ${item.qty}</span>
                            <span class="font-bold text-gray-900">${item.price * item.qty} AZN</span>
                            <button onclick="removeItem(${item.index})" class="text-red-500 hover:text-red-700">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            orderMessage += `Cəmi: ${storeTotal} AZN`;

            storeHtml += `
                    </div>
                    <div class="bg-gray-50 p-6 flex justify-between items-center">
                        <span class="font-medium text-gray-700">Cəmi: <span class="text-xl font-bold text-gray-900 ml-2">${storeTotal} AZN</span></span>
                        <a href="https://wa.me/${data.phone}?text=${encodeURIComponent(orderMessage)}" target="_blank" class="bg-green-500 text-white font-bold py-2 px-6 rounded-xl hover:bg-green-600 transition shadow-sm flex items-center">
                            WhatsApp ilə sifariş et
                        </a>
                    </div>
                </div>
            `;
            html += storeHtml;
        }

        cartContainer.innerHTML = html;
    });

    window.removeItem = function(index) {
        let cart = JSON.parse(localStorage.getItem('azcloth_cart') || '[]');
        cart.splice(index, 1);
        localStorage.setItem('azcloth_cart', JSON.stringify(cart));
        location.reload();
    };
</script>
{% endblock %}
